    &lt;title&gt;怪獸數學大作戰 - 二次根式篇&lt;/title&gt;
    &lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css&quot;&gt;
    &lt;script defer src=&quot;https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js&quot;&gt;&lt;/script&gt;
    &lt;script src=&quot;https://www.feixianglaoshi.com/musk-collect/musk-collect.js?v=1.4.0&quot;&gt;&lt;/script&gt;
    &lt;style&gt;
        :root {
            --primary-color: #4a90e2;
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --text-color: #e94560;
            --text-light: #fff;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 身份登錄頁 */
        #login-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-box h2 { text-align: center; margin-bottom: 25px; color: var(--primary-color); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3a5a;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* 頂部數據欄 */
        #stats-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid #0f3460;
            font-size: 14px;
            font-weight: bold;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            color: #ffd700;
        }
        
        .stat-item span:first-child { color: #fff; }

        /* 怪獸與戰鬥區域 */
        #battle-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #monster {
            font-size: 120px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.5));
            transition: transform 0.1s;
        }

        #monster.hit {
            transform: scale(0.9) rotate(-5deg);
            filter: hue-rotate(90deg) brightness(1.5);
        }

        #hp-bar-container {
            width: 60%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            border: 2px solid #555;
            margin-bottom: 20px;
            overflow: hidden;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.3s ease;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* 題目區域 */
        #question-area {
            background-color: #0f3460;
            padding: 30px 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 選項區域 */
        #options-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background-color: #0f3460;
        }

        .option-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px 10px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #357abd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #357abd;
        }

        .option-btn:hover { background-color: #5ba1f3; }
        .option-btn.correct { background-color: #4CAF50 !important; box-shadow: 0 4px 0 #388E3C !important; }
        .option-btn.wrong { background-color: #F44336 !important; box-shadow: 0 4px 0 #D32F2F !important; }

        .damage-text {
            position: absolute;
            color: #ffeb3b;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            animation: floatUp 1s forwards;
            opacity: 0;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }

        /* 結算頁 */
        #result-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 46, 0.95);
            z-index: 110;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .result-card {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--primary-color);
            width: 80%;
        }

        .result-card h2 { color: #ffd700; font-size: 32px; margin-bottom: 20px; }
        .result-stat { margin: 10px 0; font-size: 18px; }
        #submit-status { margin-top: 20px; font-size: 14px; color: #888; }

    &lt;/style&gt;

        &lt;button class=&quot;option-btn&quot; onclick=&quot;checkAnswer(1)&quot;&gt;&lt;span id=&quot;opt1&quot;&gt;&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;option-btn&quot; onclick=&quot;checkAnswer(2)&quot;&gt;&lt;span id=&quot;opt2&quot;&gt;&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;option-btn&quot; onclick=&quot;checkAnswer(3)&quot;&gt;&lt;span id=&quot;opt3&quot;&gt;&lt;/span&gt;&lt;/button&gt;

&lt;script&gt;
    const sdk = new MuskCollect();
    
    let userInfo = { name: '', id: '', class: '' };
    let stats = {
        wins: 0,
        streak: 0,
        maxStreak: 0,
        totalQuestions: 0,
        correctAnswers: 0,
        totalDamage: 0
    };
    
    let questionLogs = [];
    let currentQuestionData = null;

    let monsterHp = 100;
    const maxHp = 100;
    const monsters = ['👾', '👹', '👺', '👻', '👽', '🦖', '🐉'];
    let currentAnswerIndex = -1;

    function startGame() {
        const name = document.getElementById('user-name').value.trim();
        const id = document.getElementById('user-id').value.trim();
        const cls = document.getElementById('user-class').value.trim();
        
        if (!name || !id || !cls) {
            alert('請填寫完整的身份信息');
            return;
        }
        
        userInfo = { name, id, class: cls };
        document.getElementById('login-overlay').style.display = 'none';
        nextQuestion();
    }

    function updateUI() {
        document.getElementById('stat-wins').innerText = stats.wins;
        document.getElementById('stat-streak').innerText = stats.streak;
        let accuracy = stats.totalQuestions === 0 ? 0 : Math.round((stats.correctAnswers / stats.totalQuestions) * 100);
        document.getElementById('stat-accuracy').innerText = accuracy + '%';
        document.getElementById('stat-damage').innerText = stats.totalDamage;
        let hpPercent = Math.max(0, (monsterHp / maxHp) * 100);
        document.getElementById('hp-bar').style.width = hpPercent + '%';
    }

    function generateMathQuestion() {
        const type = Math.floor(Math.random() * 3);
        const typeNames = [&quot;同類二次根式加法&quot;, &quot;化簡後加法&quot;, &quot;二次根式乘法&quot;];
        const bases = [2, 3, 5, 6, 7];
        let base = bases[Math.floor(Math.random() * bases.length)];
        
        let qLatex = &quot;&quot;;
        let aLatex = &quot;&quot;;
        let wrongs = [];

        if (type === 0) {
            let c1 = Math.floor(Math.random() * 5) + 2; 
            let c2 = Math.floor(Math.random() * 5) + 2;
            qLatex = `${c1}\\sqrt{${base}} + ${c2}\\sqrt{${base}}`;
            aLatex = `${c1 + c2}\\sqrt{${base}}`;
            wrongs = [`${c1 + c2 + 1}\\sqrt{${base}}`, `${c1 + c2}\\sqrt{${base + 1}}`, `${Math.abs(c1 - c2) || 1}\\sqrt{${base}}`];
        } else if (type === 1) {
            let b = [2, 3, 5][Math.floor(Math.random() * 3)];
            let m1 = Math.floor(Math.random() * 3) + 2;
            let m2 = Math.floor(Math.random() * 3) + 2;
            let val1 = m1 * m1 * b;
            let val2 = m2 * m2 * b;
            qLatex = `\\sqrt{${val1}} + \\sqrt{${val2}}`;
            aLatex = `${m1 + m2}\\sqrt{${b}}`;
            wrongs = [`${m1 * m2}\\sqrt{${b}}`, `${m1 + m2 + 1}\\sqrt{${b}}`, `\\sqrt{${val1 + val2}}`];
        } else {
            let mBase = [2, 3][Math.floor(Math.random() * 2)];
            let c1 = Math.floor(Math.random() * 3) + 2;
            let c2 = Math.floor(Math.random() * 3) + 2;
            qLatex = `${c1}\\sqrt{${mBase}} \\times ${c2}\\sqrt{${mBase}}`;
            aLatex = `${c1 * c2 * mBase}`;
            wrongs = [`${c1 * c2}\\sqrt{${mBase}}`, `${(c1 * c2) + mBase}`, `${c1 * c2 * mBase * mBase}`];
        }

        return { 
            question: qLatex, 
            answer: aLatex, 
            distractors: wrongs,
            typeName: typeNames[type]
        };
    }

    function nextQuestion() {
        if (stats.totalQuestions &gt;= 10) {
            endGame();
            return;
        }

        currentQuestionData = generateMathQuestion();
        katex.render(currentQuestionData.question + &quot; = ?&quot;, document.getElementById('math-question'), { throwOnError: false });

        let options = [currentQuestionData.answer, ...currentQuestionData.distractors];
        currentAnswerIndex = Math.floor(Math.random() * 4);
        [options[0], options[currentAnswerIndex]] = [options[currentAnswerIndex], options[0]];

        currentQuestionData.allOptions = options;

        for (let i = 0; i &lt; 4; i++) {
            let btn = document.querySelectorAll('.option-btn')[i];
            btn.className = &quot;option-btn&quot;;
            btn.disabled = false;
            katex.render(options[i], document.getElementById(`opt${i}`), { throwOnError: false });
        }
    }

    function checkAnswer(selectedIndex) {
        stats.totalQuestions++;
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(btn =&gt; btn.disabled = true);

        const isCorrect = selectedIndex === currentAnswerIndex;
        
        questionLogs.push({
            question: currentQuestionData.question,
            type: currentQuestionData.typeName,
            correctAnswer: currentQuestionData.answer,
            userAnswer: currentQuestionData.allOptions[selectedIndex],
            isCorrect: isCorrect
        });

        if (isCorrect) {
            stats.correctAnswers++;
            stats.streak++;
            if (stats.streak &gt; stats.maxStreak) stats.maxStreak = stats.streak;
            let damage = 20 + (stats.streak * 5);
            stats.totalDamage += damage;
            monsterHp -= damage;
            buttons[selectedIndex].classList.add('correct');
            showDamage(damage);
            monsterHitAnim();
            if (monsterHp &lt;= 0) {
                setTimeout(defeatMonster, 500);
            } else {
                setTimeout(nextQuestion, 800);
            }
        } else {
            stats.streak = 0;
            buttons[selectedIndex].classList.add('wrong');
            buttons[currentAnswerIndex].classList.add('correct');
            setTimeout(nextQuestion, 1200);
        }
        updateUI();
    }

    function monsterHitAnim() {
        const monster = document.getElementById('monster');
        monster.classList.add('hit');
        setTimeout(() =&gt; monster.classList.remove('hit'), 200);
    }

    function showDamage(dmg) {
        const battleArea = document.getElementById('battle-area');
        const text = document.createElement('div');
        text.className = 'damage-text';
        text.innerText = '-' + dmg;
        text.style.left = (50 + (Math.random() * 20 - 10)) + '%';
        text.style.top = '40%';
        battleArea.appendChild(text);
        setTimeout(() =&gt; text.remove(), 1000);
    }

    function defeatMonster() {
        stats.wins++;
        monsterHp = maxHp;
        const nextMonster = monsters[Math.floor(Math.random() * monsters.length)];
        const monsterEl = document.getElementById('monster');
        monsterEl.style.transform = &quot;scale(0)&quot;;
        setTimeout(() =&gt; {
            monsterEl.innerText = nextMonster;
            monsterEl.style.transform = &quot;scale(1)&quot;;
            updateUI();
            nextQuestion();
        }, 300);
    }

    function endGame() {
        document.getElementById('result-overlay').style.display = 'flex';
        document.getElementById('res-wins').innerText = stats.wins;
        let acc = Math.round((stats.correctAnswers / stats.totalQuestions) * 100);
        document.getElementById('res-accuracy').innerText = acc + '%';
        document.getElementById('res-streak').innerText = stats.maxStreak;

        const finalData = {
            studentName: userInfo.name,
            studentId: userInfo.id,
            studentClass: userInfo.class,
            totalScore: stats.correctAnswers,
            accuracy: acc,
            maxStreak: stats.maxStreak,
            wins: stats.wins,
            details: questionLogs
        };

        sdk.save('math_battle_results', finalData)
            .then(() =&gt; {
                document.getElementById('submit-status').innerText = '數據上傳成功！';
            })
            .catch(err =&gt; {
                console.error(err);
                document.getElementById('submit-status').innerText = '數據上傳失敗，請檢查網絡。';
            });
    }

    window.onload = () =&gt; {
        updateUI();
    };
&lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')

      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')

          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
</body>
