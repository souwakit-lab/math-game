&lt;script&gt;
    const sdk = new MuskCollect();
    let allData = [];

    async function refreshData() {
        try {
            const results = await sdk.query('math_battle_results');
            allData = results;
            renderDashboard();
        } catch (err) {
            console.error('獲取數據失敗:', err);
        }
    }

    function renderDashboard() {
        if (allData.length === 0) return;

        // 1. 基礎統計
        document.getElementById('total-students').innerText = allData.length;
        const totalAcc = allData.reduce((sum, item) =&gt; sum + item.data.accuracy, 0);
        document.getElementById('avg-accuracy').innerText = Math.round(totalAcc / allData.length) + '%';
        const totalWins = allData.reduce((sum, item) =&gt; sum + item.data.wins, 0);
        document.getElementById('total-wins').innerText = totalWins;

        // 2. 題型統計 &amp; 錯題統計
        const typeStats = {};
        const wrongQuestions = {};

        allData.forEach(submission =&gt; {
            submission.data.details.forEach(detail =&gt; {
                // 題型統計
                if (!typeStats[detail.type]) {
                    typeStats[detail.type] = { total: 0, correct: 0 };
                }
                typeStats[detail.type].total++;
                if (detail.isCorrect) typeStats[detail.type].correct++;

                // 錯題統計
                if (!detail.isCorrect) {
                    const key = detail.question;
                    if (!wrongQuestions[key]) {
                        wrongQuestions[key] = { 
                            text: detail.question, 
                            type: detail.type, 
                            count: 0, 
                            wrongAnswers: {} 
                        };
                    }
                    wrongQuestions[key].count++;
                    const wa = detail.userAnswer;
                    wrongQuestions[key].wrongAnswers[wa] = (wrongQuestions[key].wrongAnswers[wa] || 0) + 1;
                }
            });
        });

        // 渲染題型
        const typeHtml = Object.keys(typeStats).map(type =&gt; {
            const acc = Math.round((typeStats[type].correct / typeStats[type].total) * 100);
            return `
                &lt;div class=&quot;flex items-center justify-between mb-2&quot;&gt;
                    &lt;span class=&quot;text-sm font-medium&quot;&gt;${type}&lt;/span&gt;
                    &lt;div class=&quot;flex items-center space-x-4&quot;&gt;
                        &lt;div class=&quot;w-48 bg-slate-200 rounded-full h-2&quot;&gt;
                            &lt;div class=&quot;bg-blue-600 h-2 rounded-full&quot; style=&quot;width: ${acc}%&quot;&gt;&lt;/div&gt;
                        &lt;/div&gt;
                        &lt;span class=&quot;text-sm text-slate-600&quot;&gt;${acc}%&lt;/span&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            `;
        }).join('');
        document.getElementById('type-stats').innerHTML = typeHtml || '&lt;p class=&quot;text-slate-500 text-sm&quot;&gt;暫無數據&lt;/p&gt;';

        // 渲染錯題
        const sortedWrongs = Object.values(wrongQuestions).sort((a, b) =&gt; b.count - a.count).slice(0, 5);
        const wrongHtml = sortedWrongs.map(q =&gt; {
            const commonWrong = Object.entries(q.wrongAnswers).sort((a, b) =&gt; b[1] - a[1])[0][0];
            return `
                &lt;tr&gt;
                    &lt;td&gt;\\(${q.text}\\)&lt;/td&gt;
                    &lt;td&gt;${q.type}&lt;/td&gt;
                    &lt;td class=&quot;text-red-600 font-bold&quot;&gt;${q.count}&lt;/td&gt;
                    &lt;td&gt;\\(${commonWrong}\\)&lt;/td&gt;
                &lt;/tr&gt;
            `;
        }).join('');
        document.querySelector('#wrong-questions-table tbody').innerHTML = wrongHtml || '&lt;tr&gt;&lt;td colspan=&quot;4&quot; class=&quot;text-center text-slate-500&quot;&gt;暫無數據&lt;/td&gt;&lt;/tr&gt;';

        // 渲染學生明细
        const studentHtml = allData.sort((a, b) =&gt; Number(b.createdAt) - Number(a.createdAt)).map(item =&gt; {
            const date = new Date(Number(item.createdAt)).toLocaleString();
            return `
                &lt;tr&gt;
                    &lt;td&gt;${item.data.studentName}&lt;/td&gt;
                    &lt;td&gt;${item.data.studentId}&lt;/td&gt;
                    &lt;td&gt;${item.data.studentClass}&lt;/td&gt;
                    &lt;td&gt;${item.data.totalScore}&lt;/td&gt;
                    &lt;td&gt;${item.data.accuracy}%&lt;/td&gt;
                    &lt;td&gt;${item.data.maxStreak}&lt;/td&gt;
                    &lt;td class=&quot;text-slate-500 text-xs&quot;&gt;${date}&lt;/td&gt;
                &lt;/tr&gt;
            `;
        }).join('');
        document.querySelector('#student-table tbody').innerHTML = studentHtml || '&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;text-center text-slate-500&quot;&gt;暫無數據&lt;/td&gt;&lt;/tr&gt;';

        // 觸發 MathJax 渲染
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function exportCSV() {
        if (allData.length === 0) return;
        let csv = '姓名,學號,班級,得分,正確率,最高連勝,擊敗怪獸,提交時間\n';
        allData.forEach(item =&gt; {
            const date = new Date(Number(item.createdAt)).toLocaleString().replace(/,/g, '');
            csv += `${item.data.studentName},${item.data.studentId},${item.data.studentClass},${item.data.totalScore},${item.data.accuracy}%,${item.data.maxStreak},${item.data.wins},${date}\n`;
        });
        const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = '怪獸數學大作戰_數據報告.csv';
        link.click();
    }

    window.onload = refreshData;
&lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://www.feixianglaoshi.com', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**

     */
    function trackLogoClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)

        window.frog.add({
          url: '/click/HtmlPage/logo',
          eventId: 42816,
          customExtend: {
            chat_id: chatId,
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'logo'
        })

        console.log('[埋点] 点击飞象老师 Logo')
      }
    }

    /**
     * 点击立即体验的埋点
     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}
        const chatId = serverData.watermarkChatId
        console.log('trackHtmlClick', chatId)
        window.frog.add({
          url: '/click/HtmlPage/start',
          eventId: 42817,
          customExtend: {
            chat_id: chatId
          },
          currentPage: 'HtmlPage',
          eventAction: 'click',
          eventName: 'start'
        })
        console.log('[埋点] 点击立即体验')
      }
    }

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
</body>

</html>
